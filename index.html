<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>申請の承認</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; margin: 0; background: #f4f6f9; color: #222; }
  .box { max-width: 560px; margin: 24px auto; padding: 20px 18px; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  .ok { color: #2f855a; } .ng { color: #c53030; } .wait { color: #555; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; margin-top: 12px; }
  th { text-align: left; background: #edf2f7; border: 1px solid #cbd5e0; padding: 6px 10px; width: 120px; white-space: nowrap; vertical-align: top; }
  td { border: 1px solid #cbd5e0; padding: 6px 10px; white-space: pre-wrap; word-break: break-all; }
  p { line-height: 1.6; }
  .note { color: #666; font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title" class="wait">承認しています…</h1>
  <div id="body"><p>しばらくお待ちください。</p></div>
</div>
<script>
// 外出許可申請の承認ページ。メールの「承認する」ボタンから開く。
// 承認の記録は Apps Script（外出許可メール承認）にあり、このページは、それを呼ぶだけ。秘密の情報は入っていない。
var GAS = 'https://script.google.com/macros/s/AKfycbwhhSN1-qc7H3JhSbsHmzpzV6hcCCpJ_nQ9NU0rgUqcyPG56jBz-Uptg-YQ07NRWFeCKw/exec';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function show(cls, title, html) {
  var t = document.getElementById('title');
  t.className = cls; t.textContent = title;
  document.getElementById('body').innerHTML = html;
}
(async function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('id'), t = q.get('t');
  if (!id || !t) { show('ng', '承認できません', '<p>このリンクは正しくありません。メールの「承認する」ボタンから開いてください。</p>'); return; }
  var url = GAS + '?action=approve&format=json&id=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(t);
  for (var i = 0; i < 3; i++) {
    try {
      var r = await fetch(url);
      var j = await r.json();
      if (!j.ok) { show('ng', '承認できません', '<p>' + esc(j.error || 'エラーが起きました。') + '</p>'); return; }
      var rows = (j.rows || []).map(function (x) { return '<tr><th>' + esc(x[0]) + '</th><td>' + esc(x[1]) + '</td></tr>'; }).join('');
      show('ok', j.already ? 'すでに承認されています' : '✅ 承認しました',
        '<p><b>' + esc(j.name) + '</b> さんの' + esc(j.label || '外出') + 'を、<b>' + esc(j.approver) + '</b> が承認しました。</p><table>' + rows + '</table>' +
        (j.kind === 'overtime' ? '<p class="note">残業申請カレンダーの承認者の枠に、「' + esc(j.approver) + '」と入ります。このページは閉じてかまいません。</p>' : '<p class="note">申請した人の日報には、数秒で「承認済み（' + esc(j.approver) + '）」と表示されます。このページは閉じてかまいません。</p>'));
      return;
    } catch (e) {
      await new Promise(function (res) { setTimeout(res, 1500); });
    }
  }
  show('ng', '承認できませんでした', '<p>通信できませんでした。電波を確認して、メールの「承認する」ボタンをもう一度押してください。</p>');
})();
</script>
</body>
</html>
